<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficjalne zaproszenie dla Marty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e9 40%, #fff5f7 100%);
            overflow-x: hidden;
            position: relative;
            color: #4a2c3a;
        }

        /* Latające serduszka */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Jamniczek z Pinteresta */
        .dachshund {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 200px;
            max-width: 40vw;
            opacity: 0.22;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.08));
        }

        @media (max-width: 600px) {
            .dachshund {
                width: 140px;
                bottom: 10px;
                right: 10px;
                opacity: 0.18;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 520px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(255, 105, 135, 0.15);
            border: 1px solid rgba(255, 182, 193, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #d6336c;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #8a5a6a;
            margin-bottom: 28px;
        }

        .step {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #ff8fab, #ff6b8a);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255, 105, 135, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 105, 135, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: linear-gradient(135deg, #ffb3c6, #ff8fab);
        }

        .btn.danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
        }

        .reaction {
            text-align: center;
            font-size: 1.1rem;
            margin: 18px 0;
            padding: 14px;
            background: #fff0f5;
            border-radius: 14px;
            color: #c2255c;
            font-weight: 500;
            display: none;
        }

        .reaction.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Suwak */
        .slider-box {
            margin: 24px 0;
            text-align: center;
        }

        .slider-label {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .slider-value {
            font-size: 2rem;
            font-weight: 700;
            color: #d6336c;
            margin: 8px 0 16px;
        }

        input[type="range"] {
            width: 100%;
            height: 10px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, #ffb3c6, #ff6b8a);
            border-radius: 10px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            background: #fff;
            border: 3px solid #ff6b8a;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .final-box {
            text-align: center;
        }

        .final-box h2 {
            color: #d6336c;
            margin-bottom: 16px;
        }

        .summary {
            background: #fff5f7;
            border-radius: 16px;
            padding: 18px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.6;
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: #d6336c;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.4);
        }

        .hidden-iframe {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Latające serduszka -->
    <div class="hearts" id="hearts"></div>

    <!-- Jamniczek z Twojej tablicy Pinterest -->
    <img src="https://i.pinimg.com/736x/7f/56/f0/7f56f0aaae35a3e773145f69dadd2cd3.jpg" 
         alt="jamniczek" 
         class="dachshund">

    <!-- Przycisk muzyki -->
    <button class="music-btn" onclick="playMusic()">Muzyka</button>

    <!-- Ukryty player YouTube -->
    <div id="player" class="hidden-iframe"></div>

    <div class="container">
        <div class="card">
            <h1>Oficjalne zaproszenie</h1>
            <p class="subtitle">dla Marty • niedziela • tylko Ty</p>

            <!-- KROK 1 -->
            <div class="step active" id="step1">
                <div class="question">Czy chcesz się spotkać w niedzielę?</div>
                <div class="options">
                    <button class="btn" onclick="answer1('tak')">Tak, oczywiście</button>
                    <button class="btn secondary" onclick="answer1('moze')">Nie wiem, domyśl się</button>
                    <button class="btn danger" onclick="answer1('nie')">Nie</button>
                </div>
                <div class="reaction" id="reaction1"></div>
            </div>

            <!-- KROK 2 -->
            <div class="step" id="step2">
                <div class="question">O której godzinie?</div>
                <div class="options">
                    <button class="btn" onclick="answer2('12:00')">12:00 – brunch i leniwe popołudnie</button>
                    <button class="btn" onclick="answer2('15:00')">15:00 – idealna pora na spacer</button>
                    <button class="btn" onclick="answer2('18:00')">18:00 – kolacja + film</button>
                    <button class="btn" onclick="answer2('20:00')">20:00 – nocna misja</button>
                    <button class="btn secondary" onclick="answer2('kiedy chcesz')">Kiedy tylko Ty będziesz gotowy</button>
                </div>
                <div class="reaction" id="reaction2"></div>
            </div>

            <!-- KROK 3 -->
            <div class="step" id="step3">
                <div class="question">Na co masz ochotę?</div>
                <div class="options">
                    <button class="btn" onclick="answer3('kolacja')">Kolacja na mieście i powrót do domu</button>
                    <button class="btn" onclick="answer3('film')">Film w domu i wspólna kolacja w domku</button>
                    <button class="btn" onclick="answer3('grzmocic')">Po co się rozdrabniać, od razu choćby się grzmocić xD</button>
                </div>
                <div class="reaction" id="reaction3"></div>
            </div>

            <!-- KROK 4 - suwak -->
            <div class="step" id="step4">
                <div class="question">Jak bardzo chce się zobaczyć?</div>
                <div class="slider-box">
                    <div class="slider-label">Od 0 do 100</div>
                    <div class="slider-value" id="sliderValue">50</div>
                    <input type="range" min="0" max="100" value="50" id="slider" oninput="updateSlider(this.value)">
                    <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-top:6px; color:#8a5a6a;">
                        <span>0</span>
                        <span>100</span>
                    </div>
                </div>
                <button class="btn" style="margin-top:20px; width:100%;" onclick="goToFinal()">Gotowe</button>
            </div>

            <!-- FINAŁ -->
            <div class="step" id="step5">
                <div class="final-box">
                    <h2>Super, już wiem wszystko!</h2>
                    <div class="summary" id="summary"></div>
                    <p style="margin-top:16px; color:#8a5a6a;">Napisz mi teraz na Messengerze, że wypełniłaś, żebym wiedział</p>
                    <button class="btn" style="margin-top:20px; width:100%;" onclick="location.reload()">Wypełnij jeszcze raz</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let answers = {
            chce: '',
            godzina: '',
            ochota: '',
            slider: 50
        };

        const nieMessages = [
            "Jesteś pewna?!",
            "No chyba żartujesz",
            "Marta… naprawdę?",
            "Spróbuj jeszcze raz",
            "Okej, to ja poczekam… ale nie za długo",
            "To był żart, prawda?",
            "Serio? Nawet jamniczek jest smutny"
        ];
        let nieIndex = 0;

        const reactions = {
            tak: "Idealnie. Już się cieszę",
            moze: "Domyślam się, że TAK. Dobrze zgadłem?",
            '12:00': "Brunch brzmi absolutnie idealnie",
            '15:00': "Spacer o 15:00? Klasyka",
            '18:00': "Kolacja + film – mój ulubiony combo",
            '20:00': "Nocna misja zatwierdzona",
            'kiedy chcesz': "Najromantyczniejsza odpowiedź ever",
            kolacja: "Kolacja na mieście i potem… dom. Notuję",
            film: "Film + kolacja w domku = czysty relaks",
            grzmocic: "Okej, zero rozdrabniania. Zrozumiałem"
        };

        function createHearts() {
            const container = document.getElementById('hearts');
            for (let i = 0; i < 18; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (6 + Math.random() * 8) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (16 + Math.random() * 16) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        function showStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showReaction(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.classList.add('show');
        }

        function answer1(val) {
            if (val === 'nie') {
                const msg = nieMessages[nieIndex % nieMessages.length];
                nieIndex++;
                showReaction('reaction1', msg);
                return;
            }

            answers.chce = val === 'tak' ? 'Tak, oczywiście' : 'Nie wiem, domyśl się';
            showReaction('reaction1', reactions[val]);
            setTimeout(() => showStep('step2'), 900);
        }

        function answer2(val) {
            answers.godzina = val;
            showReaction('reaction2', reactions[val] || 'Świetny wybór');
            setTimeout(() => showStep('step3'), 900);
        }

        function answer3(val) {
            const labels = {
                kolacja: 'Kolacja na mieście i powrót do domu',
                film: 'Film w domu i wspólna kolacja w domku',
                grzmocic: 'Po co się rozdrabniać, od razu choćby się grzmocić xD'
            };
            answers.ochota = labels[val];
            showReaction('reaction3', reactions[val]);
            setTimeout(() => showStep('step4'), 900);
        }

        function updateSlider(val) {
            answers.slider = val;
            document.getElementById('sliderValue').textContent = val;
        }

        function goToFinal() {
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <strong>Chcesz się spotkać:</strong> ${answers.chce}<br>
                <strong>Godzina:</strong> ${answers.godzina}<br>
                <strong>Na co ochota:</strong> ${answers.ochota}<br>
                <strong>Jak bardzo chcesz się zobaczyć:</strong> ${answers.slider}/100
            `;
            showStep('step5');
        }

        // Muzyka - Smoke Emerson CC FREESTYLE
        let player;
        function playMusic() {
            if (!player) {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                document.body.appendChild(tag);

                window.onYouTubeIframeAPIReady = function() {
                    player = new YT.Player('player', {
                        height: '1',
                        width: '1',
                        videoId: 'CkHXtVeCY1Q',
                        playerVars: {
                            autoplay: 1,
                            controls: 0,
                            loop: 1,
                            playlist: 'CkHXtVeCY1Q'
                        },
                        events: {
                            onReady: function(e) {
                                e.target.playVideo();
                                e.target.setVolume(40);
                            }
                        }
                    });
                };
            } else {
                player.playVideo();
            }
            document.querySelector('.music-btn').textContent = 'Muzyka gra';
        }
    </script>
</body>
</html>
